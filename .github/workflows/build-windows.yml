name: Build Windows standalone EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write          # cần để tạo Release khi push tag v*

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Kiểm tra tag khớp APP_VERSION trong license.py
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION=$(python -c "import build_windows; print(build_windows.release_constants()[0]['APP_VERSION'])")
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} khác APP_VERSION v${VERSION}. Sửa license.py hoặc tag lại; nếu không, updater sẽ khôi phục bản cũ vì sai phiên bản."
            exit 1
          fi
      - name: Build standalone EXE and verify GUI, video and bundled dependencies
        run: python build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: RenderVideoReup-Windows-onefile
          path: dist/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-build-diagnostics
          path: |
            build/windows-onefile-report.json
            build/windows-onefile-check/**/self-test.json
            build/windows-onefile-check/**/startup.log
            build/windows-onefile/**/warn-*.txt
          if-no-files-found: ignore
      - name: Tạo Release và đính kèm EXE (chỉ khi push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXE=$(ls dist/RenderVideoReup*_v*.exe)
          SHA=$(python -c "import json; print(json.load(open('build/windows-onefile-report.json', encoding='utf-8'))['sha256'])")
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$(basename "$EXE")"
          NOTES=$(printf 'Windows 10/11 64-bit: tải file .exe và chạy trực tiếp.\n\ndownload_url cho server key:\n%s\n\nsha256: %s' "$URL" "$SHA")
          # Workflow Linux có thể đã tạo Release cho cùng tag: khi đó chỉ đính kèm thêm file.
          gh release create "${GITHUB_REF_NAME}" "$EXE" --title "${GITHUB_REF_NAME}" --notes "$NOTES" \
            || gh release upload "${GITHUB_REF_NAME}" "$EXE" --clobber
          echo "download_url: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "sha256: $SHA" >> "$GITHUB_STEP_SUMMARY"
