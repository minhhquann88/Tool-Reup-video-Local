name: Build Windows standalone EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write          # cần để tạo Release khi push tag v*

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        edition: [pro, khach]    # 1 tag → 2 EXE: RenderVideoReupPro_v*.exe + RenderVideoReup_v*.exe
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Kiểm tra tag khớp APP_VERSION trong license.py
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION=$(python -c "import build_windows; print(build_windows.release_constants()[0]['APP_VERSION'])")
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} khác APP_VERSION v${VERSION}. Sửa license.py hoặc tag lại; nếu không, updater sẽ khôi phục bản cũ vì sai phiên bản."
            exit 1
          fi
      - name: Build standalone EXE (${{ matrix.edition }}) and verify GUI, video and bundled dependencies
        run: python build_windows.py --edition ${{ matrix.edition }}
      - uses: actions/upload-artifact@v4
        with:
          name: RenderVideoReup-Windows-onefile-${{ matrix.edition }}
          path: dist/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-build-diagnostics-${{ matrix.edition }}
          path: |
            build/windows-onefile-report-${{ matrix.edition }}.json
            build/windows-onefile-check/**/self-test.json
            build/windows-onefile-check/**/startup.log
            build/windows-onefile/**/warn-*.txt
          if-no-files-found: ignore
      - name: Tạo Release và đính kèm EXE (chỉ khi push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPORT="build/windows-onefile-report-${{ matrix.edition }}.json"
          EXE="dist/$(python -c "import json, sys, pathlib; print(pathlib.PureWindowsPath(json.load(open(sys.argv[1], encoding='utf-8'))['executable']).name)" "$REPORT")"
          SHA=$(python -c "import json, sys; print(json.load(open(sys.argv[1], encoding='utf-8'))['sha256'])" "$REPORT")
          APP_ID=$(python -c "import json, sys; print(json.load(open(sys.argv[1], encoding='utf-8'))['app_id'])" "$REPORT")
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$(basename "$EXE")"
          printf '%s  %s\n' "$SHA" "$(basename "$EXE")" > "$EXE.sha256"
          NOTES='Windows 10/11 64-bit: tải file .exe và chạy trực tiếp. RenderVideoReupPro_v*.exe = bản Pro, RenderVideoReup_v*.exe = bản thường. Mỗi file có kèm .sha256; download_url cho server key ghi trong Summary của từng job.'
          # Job còn lại (hoặc workflow Linux) có thể đã tạo Release cho cùng tag: khi đó chỉ đính kèm thêm file.
          gh release create "${GITHUB_REF_NAME}" "$EXE" "$EXE.sha256" --title "${GITHUB_REF_NAME}" --notes "$NOTES" \
            || gh release upload "${GITHUB_REF_NAME}" "$EXE" "$EXE.sha256" --clobber
          echo "app_id: $APP_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "download_url: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "sha256: $SHA" >> "$GITHUB_STEP_SUMMARY"
